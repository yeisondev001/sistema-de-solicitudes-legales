services:
  - type: web
    name: solicitud-informe-tecnico
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import shutil,pathlib,flet_web; w=pathlib.Path(flet_web.__file__).parent/'web'; shutil.copy('assets/favicon.png',str(w/'favicon.png')); shutil.copy('assets/icons/loading-animation.png',str(w/'icons'/'loading-animation.png')); print('Assets OK')"
    startCommand: flet run --web --port $PORT main.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
