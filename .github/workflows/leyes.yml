# Carga las leyes, reglamentos y libros comentados (jurisprudencia/leyes.py) en la base principal,
# un documento por artículo, y calcula sus vectores. Se corre a mano: Actions → Cargar leyes → Run workflow.
# Se puede repetir: lo que ya está igual no se toca, así solo se cargan las leyes nuevas.
# Necesita los secretos del repo: JURIS_DATABASE_URL, CF_ACCOUNT_ID y CF_API_TOKEN.
name: Cargar leyes

on:
  workflow_dispatch:
    inputs:
      neuronas:
        description: "Neuronas de Cloudflare para los vectores (lo que falte lo sigue la carga diaria)"
        default: "3000"
      solo_comentarios:
        description: "Solo los libros comentados (no vuelve a cargar las leyes)"
        type: boolean
        default: false

# no se cruza con la carga del Boletín, que también calcula vectores
concurrency:
  group: boletines
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install "psycopg[binary]==3.2.9" "pypdf==6.1.1" "httpx==0.28.1"
      - run: python -u cargar_leyes.py --neuronas "${{ github.event.inputs.neuronas || '3000' }}" ${{ github.event.inputs.solo_comentarios == 'true' && '--solo-comentarios' || '' }}
        env:
          JURIS_DATABASE_URL: ${{ secrets.JURIS_DATABASE_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
